name: Build and publish Android APK
on:
  push:
    tags: ["android-v*"]
    branches: [main]
    paths:
      [
        "android/**",
        "scripts/android-*.mjs",
        ".github/workflows/android-release.yml",
        "public/.well-known/assetlinks.json",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check release tag and signing configuration
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set -eu
          test -n "$SIGNING_KEY" && test -n "$SIGNING_PASSWORD" || { echo 'Configure the permanent Android signing secrets first.'; exit 1; }
          APP_VERSION=$(sed -n 's/^versionName=//p' android/version.properties | tr -d '\r')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF" = "refs/tags/android-v$APP_VERSION" || { echo 'Release tag must match android/version.properties.'; exit 1; }
          fi
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/feeledu-release.p12"
          chmod 600 "$RUNNER_TEMP/feeledu-release.p12"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.13"
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build signed APK and run Android lint
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/feeledu-release.p12
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: gradle -p android --no-daemon lintRelease assembleRelease
      - name: Verify APK identity
        run: |
          set -eu
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/feeledu-attendance.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs release/feeledu-attendance.apk > release/signature.txt
          node scripts/android-verify-release.mjs
          cd release
          sha256sum feeledu-attendance.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release
          path: release/
          retention-days: 14
          if-no-files-found: error
      - name: Remove runner signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/feeledu-release.p12"
  devices:
    needs: build
    if: startsWith(github.ref, 'refs/tags/android-v') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/android-device-check.yml
    with:
      source: artifact
    secrets:
      ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
      ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
  publish:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: [verify, build, devices]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release
          path: release
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" release/feeledu-attendance.apk release/SHA256SUMS.txt release/signature.txt --verify-tag --title "필에듀 출퇴근 ${GITHUB_REF_NAME#android-v}" --notes-file android/RELEASE_NOTES.md --latest
          gh workflow run ci.yml --ref main
